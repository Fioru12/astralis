<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </radialGradient>
    <radialGradient id="spaceGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </radialGradient>
  </defs>
  
  <rect width="512" height="512" fill="url(#spaceGradient)" rx="64"/>
  
  <circle cx="80" cy="100" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="80" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="400" cy="120" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="450" cy="200" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="100" cy="400" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="420" cy="380" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="60" cy="250" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="480" cy="80" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="350" cy="450" r="1.5" fill="#ffffff" opacity="0.6"/>
  
  <circle cx="256" cy="256" r="60" fill="url(#sunGradient)">
    <animate attributeName="r" values="60;65;60" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="180" cy="256" r="8" fill="#8c8c8c"/>
