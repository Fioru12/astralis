  </circle>
  <ellipse cx="380" cy="256" rx="35" ry="8" fill="none" stroke="#c49464" stroke-width="2" opacity="0.5"/>
  
  <circle cx="450" cy="256" r="28" fill="#e8d5a3"/>
  <ellipse cx="450" cy="256" rx="45" ry="12" fill="none" stroke="#c9b896" stroke-width="4" transform="rotate(-20 450 256)"/>
  
  <circle cx="340" cy="180" r="18" fill="#7de3f4"/>
  <circle cx="380" cy="140" r="17" fill="#4b70dd"/>
  
  <g fill="#888888" opacity="0.6">
